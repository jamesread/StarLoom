version: v2
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../service/gen
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go
    out: ../service/gen
    opt:
      - paths=source_relative
  - remote: buf.build/community/sudorandom-connect-openapi:v0.22.1
    out: ../service/gen
    opt:
      - format=json
      - path=openapi.json
      - path-prefix=/api
