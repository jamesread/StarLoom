name: Release Pipeline

permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

jobs:
  build:
    # Tag pushes reuse the commit already tested on main; skip duplicate runs.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: service/go.mod
          cache: true
          cache-dependency-path: service/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install buf
        run: |
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v1.50.0/buf-Linux-x86_64" -o /usr/local/bin/buf
          chmod +x /usr/local/bin/buf

      - name: Build
        run: make build

      - name: Unit tests
        env:
          CGO_ENABLED: '1'
        run: make test

      - name: Lint
        env:
          CGO_ENABLED: '1'
        run: make lint

      - name: Integration tests
        env:
          CGO_ENABLED: '1'
        run: make integration-test

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub release
        id: semrel
        uses: cycjimmy/semantic-release-action@v6.0.0
        with:
          semantic_version: 24.2.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-image:
    needs: [release]
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
            buf_arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
            buf_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.release.outputs.version }}

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install buf
        run: |
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v1.50.0/buf-Linux-${{ matrix.buf_arch }}" -o /usr/local/bin/buf
          chmod +x /usr/local/bin/buf

      - name: Build release inputs
        run: make protocol frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/jamesread/starloom:${{ needs.release.outputs.version }}-${{ matrix.suffix }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
          cache-from: type=gha,scope=starloom-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=starloom-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}

  publish-manifest:
    needs: [release, publish-image]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish multi-arch manifest tags
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/jamesread/starloom:${VERSION}" \
            "ghcr.io/jamesread/starloom:${VERSION}-amd64" \
            "ghcr.io/jamesread/starloom:${VERSION}-arm64"
          docker buildx imagetools create \
            -t "ghcr.io/jamesread/starloom:latest" \
            "ghcr.io/jamesread/starloom:${VERSION}-amd64" \
            "ghcr.io/jamesread/starloom:${VERSION}-arm64"
