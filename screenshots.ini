# Marketing screenshots for StarApp.
#
# Capture (frontend must be running at https://localhost:5173):
#   make screenshots
#   repo-helper screenshot
#
# Prefer `make screenshots` on Fedora/Chromium: it skips a stale
# webdriver_manager cache and uses the system chromedriver.
#
# repo-helper rewrites https:// to http://. Vite is HTTPS-only and session
# cookies are Secure, so each job starts at about:blank. Setup scripts then
# open https://localhost:5173, sign in, and apply a named theme.

[DEFAULT]
dir = var/marketing
width = 1400
height = 900
post_script_sleep = 1.2

[login-space]
url = about:blank
script = var/marketing/scripts/login_page.py

[parent-home-egypt]
url = about:blank
script = var/marketing/scripts/parent_home.py

[child-home-aztecs]
url = about:blank
script = var/marketing/scripts/child_home.py

[star-chart-greece]
url = about:blank
script = var/marketing/scripts/star_chart.py

[rewards-space-dark]
url = about:blank
script = var/marketing/scripts/rewards.py

[people-aztecs-dark]
url = about:blank
script = var/marketing/scripts/people.py

[control-panel-catppuccin]
url = about:blank
script = var/marketing/scripts/control_panel.py

[preferences-egypt]
url = about:blank
script = var/marketing/scripts/preferences.py
