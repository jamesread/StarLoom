# Compatibility wrapper: capture config lives under var/marketing/screenshots/.
# Prefer: make screenshots   or   make -C var/marketing/screenshots shoot

[DEFAULT]
dir = var/marketing/screenshots
width = 1400
height = 900
post_script_sleep = 1.2

[login-space]
url = about:blank
script = var/marketing/screenshots/scripts/login_page.py

