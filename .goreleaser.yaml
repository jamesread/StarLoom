---
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

# Binary is built inside the multi-stage Dockerfile (CGO + sqlite).
builds:
  - skip: true

dockers:
  - dockerfile: Dockerfile
    goarch: amd64
    use: buildx
    image_templates:
      - ghcr.io/jamesread/starloom:{{.Version}}-amd64
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--build-arg=VERSION={{.Version}}"
    extra_files:
      - database
      - docker-entrypoint.sh
      - frontend/dist
      - config/container/config.yaml
      - service

  - dockerfile: Dockerfile
    goarch: arm64
    use: buildx
    image_templates:
      - ghcr.io/jamesread/starloom:{{.Version}}-arm64
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--build-arg=VERSION={{.Version}}"
    extra_files:
      - database
      - docker-entrypoint.sh
      - frontend/dist
      - config/container/config.yaml
      - service

docker_manifests:
  - name_template: ghcr.io/jamesread/starloom:{{.Version}}
    image_templates:
      - ghcr.io/jamesread/starloom:{{.Version}}-amd64
      - ghcr.io/jamesread/starloom:{{.Version}}-arm64

  - name_template: ghcr.io/jamesread/starloom:latest
    image_templates:
      - ghcr.io/jamesread/starloom:{{.Version}}-amd64
      - ghcr.io/jamesread/starloom:{{.Version}}-arm64

release:
  disable: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
