# Marketing screenshots for StarLoom.
#
# Capture (frontend must be running at https://localhost:5173):
#   make -C var/marketing/screenshots shoot
#   # or from repo root: make screenshots
#
# Prefer `make screenshots` on Fedora/Chromium: it skips a stale
# webdriver_manager cache and uses the system chromedriver.
#
# title/description/theme are not used by repo-helper; `make manifest` turns
# them into screenshot-manifest.yaml for indexers. Every section needs them.

[DEFAULT]
dir = .
width = 1400
height = 900
post_script_sleep = 1.2
theme = light
manifest_project = StarLoom
manifest_base_url = https://raw.githubusercontent.com/jamesread/StarLoom/main/var/marketing/screenshots/

[login-space]
url = about:blank
script = scripts/login_page.py
title = Login
description = Sign-in screen in the Space theme, where parents and children enter the family star rewards app.

[parent-home-egypt]
url = about:blank
script = scripts/parent_home.py
title = Parent home
description = Family overview for a privileged parent in the Egypt theme, with children, stars and quick actions in one place.

[child-home-aztecs]
url = about:blank
script = scripts/child_home.py
title = Child home
description = A child's personal home in the Aztecs theme, showing their star balance and rewards they can redeem.

[star-chart-greece]
url = about:blank
script = scripts/star_chart.py
title = Weekly star chart
description = The weekly star chart in the Ancient Greece theme, where parents track chores and award stars day by day.

[rewards-space-dark]
url = about:blank
script = scripts/rewards.py
title = Rewards
description = Rewards and redemption requests in the Space theme with dark mode, so parents can approve privileges earned with stars.

[people-aztecs-dark]
url = about:blank
script = scripts/people.py
title = People
description = Family people admin in the Aztecs theme with dark mode, listing members and their roles.

[control-panel-catppuccin]
url = about:blank
script = scripts/control_panel.py
title = Control Panel
description = The system Control Panel in the Catppuccin theme, the hub for IAM, settings and other privileged tools.

[preferences-egypt]
url = about:blank
script = scripts/preferences.py
title = User preferences
description = User preferences in the Egypt theme, where each person sets language, sidebar and theme options.
